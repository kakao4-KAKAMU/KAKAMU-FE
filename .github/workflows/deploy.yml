name: Build and Push Docker Image

on:
  push:
    branches: [ "dev" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  build-and-push:
    runs-on: ubuntu-latest # 우분투 사용용
    environment: ${{ github.ref_name }}
    steps:
    - name: Checkout code # 1. 깃허브 코드 다운
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile # 도커 파일 경로

        build-args: |
          env=dev
          EXPO_PUBLIC_BACKEND_API_URL=${{ vars.EXPO_PUBLIC_BACKEND_API_URL }}
          EXPO_PUBLIC_UPLOAD_API_URL=${{ vars.EXPO_PUBLIC_UPLOAD_API_URL }}
          EXPO_PUBLIC_CHAT_API_URL=${{ vars.EXPO_PUBLIC_CHAT_API_URL }}
          EXPO_PUBLIC_IMAGE_API_URL=${{ vars.EXPO_PUBLIC_IMAGE_API_URL }}
          EXPO_PUBLIC_KAKAO_APP_KEY=${{ secrets.EXPO_PUBLIC_KAKAO_APP_KEY }}
          EXPO_PUBLIC_KAKAO_JS_KEY=${{ secrets.EXPO_PUBLIC_KAKAO_JS_KEY }}
          EXPO_PUBLIC_FIREBASE_WEB_API_KEY=${{ secrets.EXPO_PUBLIC_FIREBASE_WEB_API_KEY }}
          EXPO_PUBLIC_FIREBASE_WEB_APP_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_WEB_APP_ID }}
          EXPO_PUBLIC_FIREBASE_WEB_AUTH_DOMAIN=${{ secrets.EXPO_PUBLIC_FIREBASE_WEB_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_WEB_MEASUREMENT_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_WEB_MEASUREMENT_ID }}
          EXPO_PUBLIC_FIREBASE_WEB_MESSAGING_SENDER_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_WEB_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_WEB_PROJECT_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_WEB_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_WEB_STORAGE_BUCKET=${{ secrets.EXPO_PUBLIC_FIREBASE_WEB_STORAGE_BUCKET }}
          EXPO_PUBLIC_SENTRY_DNS=${{ vars.EXPO_PUBLIC_SENTRY_DNS }}

        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/filma-frontend-dev:latest 
          ${{ secrets.DOCKER_USERNAME }}/filma-frontend-dev:${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/filma-frontend-dev:1.${{ github.run_number }}
        cache-from: type=gha,scope=filma-frontend-dev
        cache-to: type=gha,mode=max,scope=filma-frontend-dev

    - name: Checkout Helm Chart Repo
      uses: actions/checkout@v4 # helm repo 코드 다운
      with:
        repository: kakao4-KAKAMU/kakamu_helm # 헬름 차트 깃허브 레포
        token: ${{ secrets.HELM_REPO_TOKEN }} # 레포 권한이 있는 토큰
        path: helm-charts
        ref: dev

    - name: Update Helm Values # 프론트엔드 values.yaml 이미지 태그값 검증 후 변경
      run: |
        cd helm-charts/environments/dev/front
        yq -i '.image.tag = "1.${{ github.run_number }}"' values.yaml
        
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        git add values.yaml
        
        if ! git diff --cached --quiet; then
          git commit -m "update frontend image tag to 1.${{ github.run_number }}"
          git push origin HEAD:dev
        else
          echo "No changes to commit"
        fi        
        
        
